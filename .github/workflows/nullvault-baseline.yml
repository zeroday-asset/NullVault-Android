name: NullVault baseline
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/nullvault-baseline.yml'
permissions:
  contents: read
  packages: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build F-Droid baseline
        run: bash ./gradlew :app:testFdroidDebugUnitTest :app:assembleFdroidDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NullVault-baseline-reports
          path: '**/build/reports/tests/'
      - uses: actions/upload-artifact@v4
        with:
          name: NullVault-upstream-baseline
          path: app/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error
